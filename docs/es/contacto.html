	(function() {
		try {
			var saved = localStorage.getItem('parasion_theme');
			if (saved === 'dark' || saved === 'light') {
				document.documentElement.setAttribute('data-theme', saved);
			}
		} catch (e) {}
	})();
	</script>


	<script>
	function toggleMenu() {
		document.getElementById('site-nav').classList.toggle('open');
	}
	function toggleTheme() {
		var root = document.documentElement;
		var current = root.getAttribute('data-theme');
		if (!current) {
			current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		}
		var next = current === 'dark' ? 'light' : 'dark';
		root.setAttribute('data-theme', next);
		try { localStorage.setItem('parasion_theme', next); } catch (e) {}
	}

	document.addEventListener('click', function(e) {
		var nav = document.getElementById('site-nav');
		if (nav && nav.classList.contains('open') && !nav.contains(e.target)) {
			nav.classList.remove('open');
		}
	});

	document.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') {
			var nav = document.getElementById('site-nav');
			if (nav) nav.classList.remove('open');
			return;
		}

		var tag = (e.target && e.target.tagName) || '';
		var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);

		if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
			var input = document.getElementById('gallery-filter');
			if (input) {
				e.preventDefault();
				input.focus();
				input.select();
			}
			return;
		}

		if (typing || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
		if (e.key === 'ArrowLeft') {
			var prev = document.querySelector('.gallery-nav-prev');
			if (prev) { e.preventDefault(); window.location.href = prev.href; }
		} else if (e.key === 'ArrowRight') {
			var next = document.querySelector('.gallery-nav-next');
			if (next) { e.preventDefault(); window.location.href = next.href; }
		}
	});
	</script>

	<script>
	(function() {
		var form = document.getElementById('contact-form');
		if (!form) return;
		form.addEventListener('submit', function(e) {
			e.preventDefault();
			var name = (form.elements['name'].value || '').trim();
			var email = (form.elements['email'].value || '').trim();
			var subject = (form.elements['subject'].value || '').trim();
			var message = (form.elements['message'].value || '').trim();
			var body = message + '\n\n— ' + name + ' <' + email + '>';
			var to = form.getAttribute('action').replace(/^mailto:/, '');
			var url = 'mailto:' + to +
				'?subject=' + encodeURIComponent(subject) +
				'&body=' + encodeURIComponent(body);
			window.location.href = url;
		});
	})();
	</script>

	<script>
	(function() {
		var header = document.getElementById('site-header');
		var sentinel = document.querySelector('.scroll-sentinel');
		if (sentinel && header) {
			var observer = new IntersectionObserver(function(entries) {
				header.classList.toggle('scrolled', !entries[0].isIntersecting);
			}, { threshold: 0 });
			observer.observe(sentinel);
		}
		var fadeEls = document.querySelectorAll('.fade-in');
		if (fadeEls.length) {
			var fadeObserver = new IntersectionObserver(function(entries) {
				entries.forEach(function(entry) {
					if (entry.isIntersecting) {
						entry.target.classList.add('visible');
						fadeObserver.unobserve(entry.target);
					}
				});
			}, { threshold: 0.1 });
			fadeEls.forEach(function(el) { fadeObserver.observe(el); });
		}
	})();
	</script>
