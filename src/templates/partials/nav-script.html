	<script>
	function toggleMenu() {
		var nav = document.getElementById('site-nav');
		var open = nav.classList.toggle('open');
		nav.querySelector('button').setAttribute('aria-expanded', String(open));
	}
	function toggleTheme() {
		var root = document.documentElement;
		var current = root.getAttribute('data-theme');
		if (!current) {
			current = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
		}
		var next = current === 'dark' ? 'light' : 'dark';
		root.setAttribute('data-theme', next);
		try { localStorage.setItem('parasion_theme', next); } catch (e) {}
	}

	document.addEventListener('click', function(e) {
		var nav = document.getElementById('site-nav');
		if (nav && nav.classList.contains('open') && !nav.contains(e.target)) {
			nav.classList.remove('open'); nav.querySelector('button').setAttribute('aria-expanded', 'false');
		}
	});

	document.addEventListener('keydown', function(e) {
		if (e.key === 'Escape') {
			var nav = document.getElementById('site-nav');
			if (nav && nav.classList.contains('open')) { nav.classList.remove('open'); nav.querySelector('button').setAttribute('aria-expanded', 'false'); nav.querySelector('button').focus(); }
			return;
		}

		var tag = (e.target && e.target.tagName) || '';
		var typing = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);

		if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
			var input = document.getElementById('gallery-filter');
			if (input) {
				e.preventDefault();
				input.focus();
				input.select();
			}
			return;
		}

		if (typing || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
		if (e.key === 'ArrowLeft') {
			var prev = document.querySelector('.gallery-nav-prev');
			if (prev) { e.preventDefault(); window.location.href = prev.href; }
		} else if (e.key === 'ArrowRight') {
			var next = document.querySelector('.gallery-nav-next');
			if (next) { e.preventDefault(); window.location.href = next.href; }
		}
	});
	</script>
