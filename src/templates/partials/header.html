	<header class="site-header" id="site-header">
		<div class="wrapper">
			<a class="site-title" href="{{homeUrl}}"><span class="site-title-full">{{author}}</span><span class="site-title-mobile">{{mobileBrand}}</span></a>
			<div class="header-controls">
				<div class="lang-selector lang-selector--header">
{{langSelectorLinks}}
				</div>
				<span class="header-divider" aria-hidden="true"></span>
				<div class="lang-mobile-dropdown" id="lang-mobile-dropdown">
					<button class="lang-mobile-trigger" type="button" onclick="toggleLangMenu()" aria-label="{{languageMenuLabel}}">
						<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
					</button>
					<div class="lang-mobile-menu">
{{langDropdownLinks}}
					</div>
				</div>
				<button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="{{themeLabel}}">
					<svg class="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
					<svg class="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
				</button>
				<nav class="site-nav" id="site-nav">
					<button class="nav-trigger" onclick="toggleMenu()" aria-label="{{menuButton}}">
						<span class="hamburger" id="hamburger">
							<span></span><span></span><span></span>
						</span>
					</button>
					<div class="dropdown">
{{navLinks}}
					</div>
				</nav>
			</div>
		</div>
	</header>
