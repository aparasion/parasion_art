<dialog class="coloring-popup" id="coloring-popup" aria-labelledby="coloring-popup-title" aria-describedby="coloring-popup-description">
	<button class="coloring-popup__close" type="button" aria-label="{{popup_close}}" autofocus>&times;</button>
	<div class="coloring-popup__art">
		<img src="{{popup_coverImage}}" width="{{popup_coverWidth}}" height="{{popup_coverHeight}}" alt="{{popup_coverAlt}}" decoding="async">
	</div>
	<div class="coloring-popup__content">
		<p class="coloring-popup__eyebrow">{{popup_eyebrow}}</p>
		<h2 id="coloring-popup-title">{{popup_title}}</h2>
		<p class="coloring-popup__intro">{{popup_intro}}</p>
		<p id="coloring-popup-description">{{popup_description}}</p>
		<a class="coloring-popup__cta" href="{{popup_url}}" target="_blank" rel="noopener noreferrer">{{popup_cta}} <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg><span class="coloring-popup__sr-only">{{popup_newTab}}</span></a>
		<button class="coloring-popup__later" type="button">{{popup_later}}</button>
	</div>
</dialog>
<button class="coloring-launcher" id="coloring-launcher" type="button" aria-label="{{popup_reopen}}" aria-haspopup="dialog" aria-controls="coloring-popup" hidden>
	<img src="{{popup_coverImage}}" width="{{popup_coverWidth}}" height="{{popup_coverHeight}}" alt="" decoding="async">
	<span><strong>{{popup_launcherTitle}}</strong><span>{{popup_launcherLink}} <span aria-hidden="true">→</span></span></span>
</button>
<script>
(function () {
	'use strict';
	var dialog = document.getElementById('coloring-popup');
	if (!dialog || typeof dialog.showModal !== 'function') return;
	var key = 'parasion_coloring_popup_seen_v1' + (document.documentElement.lang === 'pl' ? '' : '_' + document.documentElement.lang);
	function wasSeen() {
		try { return sessionStorage.getItem(key) === '1'; } catch (_) { return false; }
	}
	var launcher = document.getElementById('coloring-launcher');
	var image = dialog.querySelector('img');
	var timer;
	var finished = wasSeen();
	var restoreScroll = null;
	function showLauncher() {
		launcher.hidden = dialog.open || !(finished || wasSeen()) || !image.complete || !image.naturalWidth;
	}
	function restore() {
		if (restoreScroll) { restoreScroll(); restoreScroll = null; }
	}
	function close() {
		dialog.close();
		restore();
		showLauncher();
		if (!launcher.hidden) launcher.focus({ preventScroll: true });
	}
	launcher.addEventListener('click', openPopup);
	image.addEventListener('load', showLauncher);
	showLauncher();
	dialog.addEventListener('cancel', function (event) { event.preventDefault(); close(); });
	dialog.querySelector('.coloring-popup__close').addEventListener('click', close);
	dialog.querySelector('.coloring-popup__later').addEventListener('click', close);
	dialog.querySelector('.coloring-popup__cta').addEventListener('click', close);
	dialog.addEventListener('keydown', function (event) {
		// Keep the site's gallery keyboard shortcuts from navigating behind the modal.
		event.stopPropagation();
		if (event.key !== 'Tab') return;
		var first = dialog.querySelector('.coloring-popup__close');
		var last = dialog.querySelector('.coloring-popup__later');
		if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
		else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
	});
	// Only dismiss an actual backdrop click, never a click on the card itself.
	var backdropDown = false;
	function outside(event) {
		var rect = dialog.getBoundingClientRect();
		return event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
	}
	dialog.addEventListener('pointerdown', function (event) { backdropDown = event.target === dialog && outside(event); });
	dialog.addEventListener('click', function (event) {
		if (backdropDown && event.target === dialog && outside(event)) close();
		backdropDown = false;
	});
	dialog.addEventListener('close', function () {
		if (!dialog.open) { restore(); showLauncher(); }
	});
	function openWhenReady() {
		if (finished || wasSeen()) return;
		// A failed or missing cover must never produce a broken promotional card.
		if (!image.complete) { timer = setTimeout(openWhenReady, 500); return; }
		if (!image.naturalWidth) return;
		var active = document.activeElement;
		if (document.hidden || document.querySelector('dialog[open]') ||
			(active && (active.matches('input, textarea, select') || active.isContentEditable))) {
			timer = setTimeout(openWhenReady, 1000);
			return;
		}
		openPopup();
	}
	function openPopup() {
		if (!image.naturalWidth || document.querySelector('dialog[open]')) return;
		clearTimeout(timer);
		var body = document.body;
		var overflow = body.style.overflow;
		var padding = body.style.paddingRight;
		var gap = window.innerWidth - document.documentElement.clientWidth;
		body.style.paddingRight = (parseFloat(getComputedStyle(body).paddingRight) + gap) + 'px';
		body.style.overflow = 'hidden';
		restoreScroll = function () { body.style.overflow = overflow; body.style.paddingRight = padding; };
		try { dialog.showModal(); } catch (_) { restoreScroll(); restoreScroll = null; return; }
		dialog.scrollTop = 0;
		launcher.hidden = true;
		finished = true;
		try { sessionStorage.setItem(key, '1'); } catch (_) { /* Storage may be disabled. */ }
	}
	if (!finished) timer = setTimeout(openWhenReady, 3000);
	window.addEventListener('pagehide', function () { clearTimeout(timer); if (dialog.open) close(); });
	window.addEventListener('pageshow', function (event) {
		showLauncher();
		if (event.persisted && !finished && !wasSeen()) timer = setTimeout(openWhenReady, 3000);
	});
})();
</script>
