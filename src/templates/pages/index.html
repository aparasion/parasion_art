<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{> head}}
{{> nav-script}}
{{> lang-redirect}}
</head>
<body>

	<div class="scroll-sentinel"></div>

{{> header}}

	<main class="page-content">

		<section class="hero fade-in">
			<div class="wrapper">
				<div class="hero-inner">
					<div class="hero-portrait">
						<img src="/img/bpr.png" alt="{{heroAlt}}" width="200" height="200">
					</div>
					<div class="hero-text">
						<span class="hero-eyebrow">{{heroSubtitle}}</span>
						<h1 class="hero-name">{{author}}</h1>
						<p class="bio">{{bio}}</p>
						<a class="hero-contact" href="{{contactUrl}}">{{contactLabel}} <span aria-hidden="true">↗</span></a>
					</div>
				</div>
			</div>
		</section>

		<section class="featured-strip fade-in" id="gallery">
			<div class="wrapper">
				<div class="featured-grid">
{{featuredCards}}
				</div>
			</div>
		</section>

		<script>
		(function () {
			var grid = document.querySelector('.featured-grid');
			if (!grid) return;
			function shuffle() {
				var cards = Array.from(grid.children);
				if (cards.length < 2) return;
				var key = 'parasion_gallery_order';
				var previous = cards.map(function (card) { return card.getAttribute('href'); }).join('|');
				try { previous = sessionStorage.getItem(key) || previous; } catch (_) {}
				for (var i = cards.length - 1; i > 0; i--) {
					var j = Math.floor(Math.random() * (i + 1));
					var card = cards[i]; cards[i] = cards[j]; cards[j] = card;
				}
				function order() { return cards.map(function (card) { return card.getAttribute('href'); }).join('|'); }
				if (order() === previous) cards.push(cards.shift());
				var fragment = document.createDocumentFragment();
				cards.forEach(function (card) { fragment.appendChild(card); });
				grid.appendChild(fragment);
				try { sessionStorage.setItem(key, order()); } catch (_) {}
			}
			shuffle();
			window.addEventListener('pageshow', function (event) { if (event.persisted) shuffle(); });
		})();
		</script>

	</main>

{{> footer}}

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "Artist",
		"name": "{{author}}",
		"url": "{{domain}}",
		"image": "{{domain}}/img/bpr.png",
		"description": "{{jsonLdDescription}}",
		"sameAs": ["{{facebook}}"]
	}
	</script>

{{> scroll-effects}}

</body>
</html>
