<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{> head}}
{{> nav-script}}
{{> lang-redirect}}
</head>
<body>

	<div class="scroll-sentinel"></div>

{{> header}}

	<main class="page-content">

		<section class="hero">
			<div class="wrapper">
				<div class="hero-inner">
					<div class="hero-text">
						<span class="hero-eyebrow">{{heroSubtitle}}</span>
						<h1 class="hero-name">{{author}}</h1>
						<a href="#gallery" class="hero-scroll" aria-label="scroll to gallery">scroll</a>
					</div>
					<div class="hero-portrait">
						<img src="/img/bpr.png" alt="{{heroAlt}}" width="300" height="300">
					</div>
				</div>
			</div>
		</section>

		<section class="about fade-in">
			<div class="wrapper wrapper--narrow">
				<p class="bio">{{bio}}</p>
			</div>
		</section>

		<section class="featured fade-in" id="gallery">
			<div class="wrapper">
				<div class="gallery-grid">
{{galleryCards}}
				</div>
			</div>
		</section>

	</main>

{{> footer}}

	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "Artist",
		"name": "{{author}}",
		"url": "{{domain}}",
		"image": "{{domain}}/img/bpr.png",
		"description": "{{jsonLdDescription}}",
		"sameAs": ["{{facebook}}"]
	}
	</script>

{{> scroll-effects}}

</body>
</html>
