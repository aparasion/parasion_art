<!DOCTYPE html>
<html lang="{{lang}}">
<head>
{{> head}}
{{> nav-script}}
</head>
<body>

	<div class="scroll-sentinel"></div>

{{> header}}

	<main class="page-content">
		<div class="wrapper">

			<div class="contact-page fade-in">
				<h1 class="contact-title">{{contactTitle}}</h1>
				<p class="contact-subtitle">{{contactSubtitle}}</p>

				<div class="contact-info">
					<div class="contact-item">
						<svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
						<div class="contact-item-body">
							<span class="contact-label">Email</span>
							<span id="email-contact"></span>
							<script>
							var u = "boleslaw", d = "parasion.art";
							document.getElementById('email-contact').innerHTML = '<a href="mailto:' + u + '@' + d + '">' + u + '@' + d + '</a>';
							</script>
						</div>
					</div>

					<div class="contact-item">
						<svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
						<div class="contact-item-body">
							<span class="contact-label">{{phoneLabel}}</span>
							<a href="tel:+48665973223">+48 665 973 223</a>
						</div>
					</div>

					<div class="contact-item">
						<svg class="contact-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
						<div class="contact-item-body">
							<span class="contact-label">Facebook</span>
							<a href="{{facebook}}" target="_blank" rel="noopener">{{facebookLabel}}</a>
						</div>
					</div>
				</div>

				<form class="contact-form" id="contact-form" action="https://api.web3forms.com/submit" method="POST">
					<input type="hidden" name="access_key" value="81f56f53-44f6-4dd3-a0a5-f01c049a21ec">
					<span class="contact-form-heading">{{contactFormHeading}}</span>

					<div class="field-row">
						<div class="field">
							<label class="field-label" for="cf-name">{{formName}}</label>
							<input id="cf-name" name="name" type="text" autocomplete="name" required>
						</div>
						<div class="field">
							<label class="field-label" for="cf-email">{{formEmail}}</label>
							<input id="cf-email" name="email" type="email" autocomplete="email" required>
						</div>
					</div>

					<div class="field">
						<label class="field-label" for="cf-message">{{formMessage}}</label>
						<textarea id="cf-message" name="message" rows="5" required></textarea>
					</div>

					<button class="contact-submit" type="submit">{{formSend}} →</button>
				</form>

				<div class="contact-success" id="contact-success">
					<p class="contact-success-title">{{formSuccessTitle}}</p>
					<div class="contact-success-details">
						<div class="contact-success-row">
							<span class="contact-success-label">{{formName}}</span>
							<span id="sent-name" class="contact-success-value"></span>
						</div>
						<div class="contact-success-row">
							<span class="contact-success-label">{{formEmail}}</span>
							<span id="sent-email" class="contact-success-value"></span>
						</div>
						<div class="contact-success-row contact-success-row--message">
							<span class="contact-success-label">{{formMessage}}</span>
							<span id="sent-message" class="contact-success-value"></span>
						</div>
					</div>
				</div>
			</div>

		</div>
	</main>

{{> footer}}

	<script>
	(function() {
		var form = document.getElementById('contact-form');
		var successEl = document.getElementById('contact-success');
		if (!form) return;
		form.addEventListener('submit', function(e) {
			e.preventDefault();
			var name = (form.elements['name'].value || '').trim();
			var email = (form.elements['email'].value || '').trim();
			var message = (form.elements['message'].value || '').trim();
			var btn = form.querySelector('[type="submit"]');
			if (btn) btn.disabled = true;
			fetch('https://api.web3forms.com/submit', {
				method: 'POST',
				body: new FormData(form)
			})
			.then(function(r) { return r.json(); })
			.then(function(json) {
				if (json.success) {
					document.getElementById('sent-name').textContent = name;
					document.getElementById('sent-email').textContent = email;
					document.getElementById('sent-message').textContent = message;
					form.style.display = 'none';
					if (successEl) successEl.classList.add('visible');
				} else {
					if (btn) btn.disabled = false;
				}
			})
			.catch(function() {
				if (btn) btn.disabled = false;
			});
		});
	})();
	</script>

{{> scroll-effects}}

</body>
</html>
